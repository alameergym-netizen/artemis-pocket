name: Build Artemis Pocket

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "docs/**"
      - "pc-setup/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref_name != 'ci-logs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNonRoot_gameRelease 2>&1 | tee build.log

      # Artemis Pocket's own unit tests (game info, matching, button setup...): a failure stops
      # the release, and the failing checks land in the CI log like build errors do
      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testNonRoot_gameReleaseUnitTest --tests 'com.limelight.pocket.*' 2>&1 | tee -a build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          cp "$APK" "out/ArtemisPocket-${GITHUB_SHA::7}.apk"
          ls -la out

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArtemisPocket-apk
          path: out/*.apk

      - name: Publish "latest" release
        if: success() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "Artemis Pocket (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download the APK below on your Retroid Pocket and install it." \
            --target "$GITHUB_SHA"

      # The build log is pushed to the ci-logs branch so it can be read with plain git (no login needed)
      - name: Push build log
        if: always()
        run: |
          STATUS="${{ job.status }}"
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "status: ${STATUS}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -nE "error:|warning: \[|FAILED|What went wrong|e: |\.java:[0-9]+: error|Exception|expected:|AssertionError" "$GITHUB_WORKSPACE/build.log" | head -n 300 > errors.txt || true
            tail -n 400 "$GITHUB_WORKSPACE/build.log" > tail.txt
          fi
          git add -A
          git commit -q -m "CI log for ${GITHUB_SHA::7} (${STATUS})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs
