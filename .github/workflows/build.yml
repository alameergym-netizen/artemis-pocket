name: Build Pocket Nexus

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "docs/**"
      - "pc-setup/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref_name != 'ci-logs' && github.ref_name != 'ci-shots'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNonRoot_gameRelease 2>&1 | tee build.log

      # Artemis Pocket's own unit tests (game info, matching, button setup...): a failure stops
      # the release, and the failing checks land in the CI log like build errors do
      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testNonRoot_gameReleaseUnitTest --tests 'com.limelight.pocket.*' 2>&1 | tee -a build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          cp "$APK" "out/PocketNexus-${GITHUB_SHA::7}.apk"
          # The PC helper goes with every build (the app and the helper speak the same protocol)
          (cd pc-setup && zip -qr "../out/PocketNexus-PC.zip" . -x "*.md" "tests/*")
          ls -la out

      # The same app built for x86_64, only for the emulator screenshots below (never released)
      - name: Build emulator APK
        if: success()
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleNonRoot_gameRelease -PpocketAbis=x86_64 2>&1 | tail -n 30
          mkdir -p out-emu
          cp "$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)" out-emu/PocketNexus-emu.apk

      - name: Upload emulator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PocketNexus-emu
          path: out-emu/*.apk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PocketNexus-apk
          path: |
            out/*.apk
            out/*.zip

      - name: Publish "latest" release
        if: success() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk out/*.zip \
            --title "Pocket Nexus (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install the APK on your Retroid Pocket. On the gaming PC, unzip PocketNexus-PC.zip and run PocketNexus-PC.bat (it replaces Artemis Pocket PC)." \
            --target "$GITHUB_SHA"

      # The build log is pushed to the ci-logs branch so it can be read with plain git (no login needed)
      - name: Push build log
        if: always()
        run: |
          STATUS="${{ job.status }}"
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "status: ${STATUS}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -nE "error:|warning: \[|FAILED|What went wrong|e: |\.java:[0-9]+: error|Exception|expected:|AssertionError" "$GITHUB_WORKSPACE/build.log" | head -n 300 > errors.txt || true
            tail -n 400 "$GITHUB_WORKSPACE/build.log" > tail.txt
          fi
          git add -A
          git commit -q -m "CI log for ${GITHUB_SHA::7} (${STATUS})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

  # The app on an Android emulator: every main screen photographed with games in it, so the
  # design can be checked without a handheld. Pushed to the ci-shots branch (plain git to read).
  shots:
    needs: apk
    if: github.ref_name != 'ci-logs' && github.ref_name != 'ci-shots'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get the APK
        uses: actions/download-artifact@v4
        with:
          name: PocketNexus-emu
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          ram-size: 2560M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: bash .github/shots/run_shots.sh

      - name: Runner state
        if: always()
        run: |
          free -m || true
          sudo dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom" | tail -n 10 || true

      - name: Push screenshots
        if: always()
        run: |
          mkdir -p shots
          cd shots
          echo "commit: ${GITHUB_SHA}" > status.txt
          echo "status: ${{ job.status }}" >> status.txt
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-shots
